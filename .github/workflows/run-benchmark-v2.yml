name: "Ceno Benchmark v2"

on:
  workflow_dispatch:
    inputs:
      ceno_version:
        description: "Ceno version (commit sha or branch) to benchmark; leave empty to use pinned Cargo.toml version"
        required: false
        type: string
        default: ""
      source_repository:
        description: "Origin repository to comment back to"
        required: false
        type: string
        default: ""
      source_pr_number:
        description: "Origin pull request number to comment back to"
        required: false
        type: string
        default: ""
      block_number:
        description: "Block number to generate input for"
        required: true
        type: string
        default: "23817600"
      proof-uuid:
        # PROOF_UUID is the S3/HTTPS path segment written by server/prove_block.sh:
        # https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${S3_PREFIX}/${PROOF_UUID}/${BLOCK_NUMBER}.bin
        description: "PROOF_UUID: S3 namespace for ready-to-use generated inputs, usually the prover cluster/job name"
        required: false
        type: string
        default: "idc-us-2-9"
      s3_bucket:
        # S3_BUCKET is the bucket that stores generated inputs, proofs, and metrics from prove_block.sh.
        description: "S3_BUCKET: bucket containing prove_block.sh generated inputs and proof artifacts"
        required: false
        type: string
        default: "prover-stat-data"
      s3_prefix:
        # S3_PREFIX is the prefix before PROOF_UUID in the prove_block.sh S3 object layout.
        description: "S3_PREFIX: prefix before PROOF_UUID in the generated-input S3 path"
        required: false
        type: string
        default: "proofs/testing"
      aws_region:
        # AWS_REGION selects the virtual-hosted S3 HTTPS endpoint for generated-input download.
        description: "AWS_REGION: AWS region used in the generated-input HTTPS download URL"
        required: false
        type: string
        default: "us-west-2"
      chain_id:
        # CHAIN_ID selects the local benchmark cache path rpc-cache/input/${CHAIN_ID}/${BLOCK_NUMBER}.bin.
        description: "CHAIN_ID: chain id used in the local rpc-cache input path"
        required: false
        type: string
        default: "1"
      frozen_input_sha256:
        description: "Optional SHA-256 of the generated input; when set, download or digest mismatch is fatal"
        required: false
        type: string
        default: ""
      rerun_keygen:
        description: "Rerun keygen"
        required: false
        type: boolean
      recompile_reth:
        description: "Recompile reth program"
        required: false
        type: boolean
      reth_version:
        description: "The git commit or branch of Reth program to compile from"
        required: false
        type: string
        default: ""
      cleanup:
        description: "Cleanup after benchmark"
        required: false
        type: boolean
        default: "true"
      ignore_failed:
        description: "Continue even if benchmark run fails"
        required: false
        type: boolean
        default: "false"
      run_gpu_benchmark:
        description: "Run the GPU benchmark job"
        required: false
        type: boolean
        default: "true"
      run_gpu_mem_estimation:
        description: "Run the GPU memory estimation check job"
        required: false
        type: boolean
        default: "false"
      gpu_devices:
        description: "Logical CUDA devices exposed inside the runner container; use 0 for one GPU or 0,1 for two GPUs"
        required: false
        type: string
        default: "0"
      gpu_runner_label:
        description: "Self-hosted GPU runner label; use dual-gpu for a runner that exposes two GPUs"
        required: false
        type: string
        default: "gpu"
      gpu_large_task_booking_margin_mb:
        description: "Value for CENO_GPU_LARGE_TASK_BOOKING_MARGIN_MB"
        required: false
        type: string
        default: "3048"
      chip_proving_mode:
        description: "Bounded chip scheduler lane count, or sequential control"
        required: false
        type: choice
        default: "lanes-4"
        options:
          - "sequential"
          - "lanes-1"
          - "lanes-2"
          - "lanes-3"
          - "lanes-4"
          - "lanes-5"
          - "lanes-6"
          - "lanes-7"
          - "lanes-8"
      gpu_mem_tracking:
        description: "Value for CENO_GPU_MEM_TRACKING"
        required: false
        type: choice
        default: "0"
        options:
          - "0"
          - "1"
      gpu_cache_level:
        description: "Value for CENO_GPU_CACHE_LEVEL: 0/none disables GPU cache, 1/trace caches trace only, 2/full caches trace and encoded codeword"
        required: false
        type: choice
        default: "1"
        options:
          - "0"
          - "1"
          - "2"
      max_cell_per_shard:
        # Validated on blocks 23817600, 25580200, 25586000, and 25586200 on a 24GB RTX 4090.
        description: "Value for CENO_MAX_CELL_PER_SHARD; validated default 4500000000"
        required: false
        type: string
        default: "4500000000"
      gpu_jagged_reshape_log_height:
        description: "Value for CENO_GPU_JAGGED_RESHAPE_LOG_HEIGHT; 25 probably OOMs on RTX 4090"
        required: false
        type: string
        default: "23"

# Diagnostic branch: reuse the benchmark job for one pinned paired comparison.
jobs:
  benchmark:
    if: ${{ inputs.run_gpu_benchmark }}
    runs-on: [self-hosted, x64, linux, "${{ inputs.gpu_runner_label }}"]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-11-20
          components: rust-src
          cache: false

      - name: Give Github Action access to ceno-gpu
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SECRET_FOR_CENO_GPU }}

      - name: Validate diagnostic profile
        env:
          BLOCK: ${{ inputs.block_number }}
          DEVICES: ${{ inputs.gpu_devices }}
          MODE: ${{ inputs.chip_proving_mode }}
          BUDGET: ${{ inputs.max_cell_per_shard }}
          CACHE: ${{ inputs.gpu_cache_level }}
          HEIGHT: ${{ inputs.gpu_jagged_reshape_log_height }}
          MARGIN: ${{ inputs.gpu_large_task_booking_margin_mb }}
          TRACKING: ${{ inputs.gpu_mem_tracking }}
        run: |
          test "$BLOCK" = 23817600
          test "$DEVICES" = 0
          test "$MODE" = lanes-4
          test "$BUDGET" = 4500000000
          test "$CACHE" = 1
          test "$HEIGHT" = 23
          test "$MARGIN" = 3048
          test "$TRACKING" = 0

      - name: Build and compare pinned opcode assignment variants
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          RPC_1: ${{ secrets.RPC_URL_1 }}
          A_CENO: b457c552392bc7af8cbfa511de891688c4c9b397
          A_GPU: fb24f7694fe9d1f6f8ba8dd23b5ad1b8fb09dab0
          B_CENO: 18f3e33f652a2ab9d5547a66af299021d6830a78
          B_GPU: 35e50efaac3182237815aefb1b9d5a79fb8dc68a
        run: |
          import hashlib, http.client, io, json, os, pathlib, resource, shutil, sqlite3, subprocess, time, urllib.request, zipfile
          root = pathlib.Path.cwd()
          out = root / 'opcode-results'
          out.mkdir(exist_ok=True)
          resource.setrlimit(resource.RLIMIT_STACK, (1073741824, resource.getrlimit(resource.RLIMIT_STACK)[1]))
          env = os.environ.copy()
          # Match the existing workflow defaults; profiling is enabled only for the traces.
          for k in list(env):
              if k.startswith('CENO_'):
                  del env[k]
          env.update(CENO_GPU_ENABLE_WITGEN='1', CENO_GPU_WITGEN='1', CENO_CHIP_PROVING_MODE='lanes', CENO_CHIP_PROVING_LANES='4', CENO_GPU_LARGE_TASK_BOOKING_MARGIN_MB='3048', CENO_GPU_MEM_TRACKING='0', CENO_MAX_CELL_PER_SHARD='4500000000', CENO_GPU_JAGGED_RESHAPE_LOG_HEIGHT='23', CENO_GPU_CACHE_LEVEL='1', RUST_MIN_STACK='536870912', RUSTFLAGS='-C target-feature=+avx2', CUDA_ARCH='89,120', RUST_LOG='info,openvm_stark_*=warn,openvm_cuda_common=warn', JEMALLOC_SYS_WITH_MALLOC_CONF='retain:true,background_thread:true,metadata_thp:always,thp:always,dirty_decay_ms:10000,muzzy_decay_ms:10000,abort_conf:true')
          env['CARGO_TARGET_DIR'] = str(root / 'target')

          def run(args, *, cwd=root, log=None, runenv=env):
              if log:
                  with pathlib.Path(log).open('w') as f:
                      subprocess.run(args, cwd=cwd, env=runenv, stdout=f, stderr=subprocess.STDOUT, check=True)
              else:
                  subprocess.run(args, cwd=cwd, env=runenv, check=True)

          def digest(p):
              with p.open('rb') as f:
                  result = hashlib.sha256()
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      result.update(chunk)
                  return result.hexdigest()

          # Extract NVIDIA's pinned CLI locally; no runner-image or system-package change.
          tools = root / 'opcode-tools'
          tools.mkdir(exist_ok=True)
          package = tools / 'nsys.deb'
          run(['curl','-fL','--max-time','120','--output',str(package),'https://developer.download.nvidia.com/devtools/repos/ubuntu2204/amd64/NsightSystems-linux-cli-public-2025.1.1.131-3554042.deb'])
          assert digest(package) == '744f066dc5771939674937c0702688d5c615d9e14981aa1ee69d9eaf400a29fa'
          run(['dpkg-deb','-x',str(package),str(tools/'nsys')])
          env['PATH'] = str(tools/'nsys/opt/nvidia/nsight-systems-cli/2025.1.1/target-linux-x64') + ':' + env['PATH']
          run(['nsys', '--version'],log=out/'nsys-version.txt')
          active = subprocess.check_output(['nvidia-smi','--query-compute-apps=pid','--format=csv,noheader'],text=True).strip()
          assert not active, 'GPU has another compute workload before diagnostic batch'
          run(['nvidia-smi', '-q'], log=out/'hardware.txt')
          run(['rustc', '-Vv'], log=out/'rustc.txt')
          run(['df','-h'], log=out/'disk.txt')
          # Prove that CUDA API/activity capture works before any expensive build or proof.
          probe_source = tools / 'capture-probe.cu'
          probe_source.write_text('#include <cuda_runtime.h>\n__global__ void capture_probe(int* p) { *p = 42; }\nint main() { int* p; int value = 0; if (cudaMalloc((void**)&p, sizeof(int))) return 1; capture_probe<<<1,1>>>(p); if (cudaMemcpy(&value, p, sizeof(int), cudaMemcpyDeviceToHost)) return 2; if (cudaFree(p)) return 3; return value == 42 ? 0 : 4; }\n')
          probe_binary = tools / 'capture-probe'
          run(['nvcc','-gencode','arch=compute_89,code=sm_89','-gencode','arch=compute_120,code=sm_120',str(probe_source),'-o',str(probe_binary)],log=out/'capture-probe-build.log')
          profile = ['nsys', 'profile', '--trace=cuda,nvtx,osrt', '--sample=none', '--cpuctxsw=none', '--force-overwrite=true']
          run(profile+['--output='+str(out/'capture-probe'), str(probe_binary)], log=out/'capture-probe.log')
          run(['nsys','export','--type=sqlite','--force-overwrite=true','--output='+str(out/'capture-probe.sqlite'),str(out/'capture-probe.nsys-rep')],log=out/'capture-probe-export.log')
          with sqlite3.connect(out/'capture-probe.sqlite') as db:
              assert db.execute('select count(*) from CUPTI_ACTIVITY_KIND_KERNEL').fetchone()[0] > 0

          # Reuse the current, already-verified guest. No guest rebuild can change A/B work.
          connection = http.client.HTTPSConnection('api.github.com',timeout=30)
          connection.request('GET','/repos/scroll-tech/ceno-reth-benchmark/actions/artifacts/10486775959/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'ceno-opcode-diagnostic','Accept':'application/vnd.github+json'})
          response = connection.getresponse()
          assert response.status == 302, 'Cannot download pinned guest artifact: '+str(response.status)
          location = response.getheader('Location')
          connection.close()
          # The redirected artifact request deliberately carries no GitHub credential.
          with urllib.request.urlopen(location,timeout=60) as response:
              with zipfile.ZipFile(io.BytesIO(response.read())) as archive:
                  archive.extractall(out/'guest')
          guest = out/'guest/ceno-client-eth'
          assert digest(guest) == 'aa5dab3effd163111177d99966b3862a1127581d08fccc46b6c476315c8c0f46'
          input_file = root/'rpc-cache/input/1/23817600.bin'
          input_file.parent.mkdir(parents=True,exist_ok=True)
          run(['curl','-fL','--connect-timeout','10','--max-time','120','--retry','3','--output',str(input_file),'https://prover-stat-data.s3.us-west-2.amazonaws.com/proofs/testing/idc-us-2-9/23817600.bin'])
          assert digest(input_file) == '23b97818f3e2787dfe62956c999de15f5fa49af31215ee7ba61b2d598648686e'

          identities = {'workflow':os.environ['GITHUB_SHA'],'guest_sha256':digest(guest),'input_sha256':digest(input_file),'variants':{}}
          binaries = {}
          for variant, benchrev in [('A','723cec9e46163528bc4ba9b7a2561e65b3c08865'),('B','30344121b92b028b3aace5c30d5b640cdc047d77')]:
              work = root/('opcode-'+variant)
              run(['git','clone','--shared','--no-checkout',str(root),str(work)])
              run(['git','checkout','--detach',benchrev],cwd=work)
              patches=[]
              ceno = root/('ceno-'+variant)
              gpu = root/('gpu-'+variant)
              for name,url,path in [('CENO','https://github.com/scroll-tech/ceno.git',ceno),('GPU','git@github.com:scroll-tech/ceno-gpu.git',gpu)]:
                  revision=os.environ[variant+'_'+name]
                  run(['git','clone','--no-checkout',url,str(path)])
                  run(['git','checkout','--detach',revision],cwd=path)
                  assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=path,text=True).strip()==revision
                  if name=='GPU':
                      run(['git','submodule','update','--init','--recursive'],cwd=path)
              for name in ['ceno_emul','ceno_host','ceno_zkvm','gkr_iop','ceno_recursion_v2']:
                  patches += ['--config',f'patch."https://github.com/scroll-tech/ceno.git".{name}.path="{ceno/name}"']
              patches += ['--config',f'patch."https://github.com/scroll-tech/ceno.git".ceno_cli.path="{ceno}/ceno_cli"','--config','patch."https://github.com/scroll-tech/ceno.git".ceno_cli.package="cargo-ceno"']
              patches += ['--config',f'patch."https://github.com/scroll-tech/ceno-gpu-mock.git".ceno_gpu.path="{gpu}/cuda_hal"','--config','patch."https://github.com/scroll-tech/ceno-gpu-mock.git".ceno_gpu.package="cuda_hal"']
              guest_dest=work/'bin/ceno-client-eth/target/riscv32im-ceno-zkvm-elf/release/ceno-client-eth'
              guest_dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(guest,guest_dest)
              # Freeze the graph after the explicit source substitutions; build it locked.
              with (out/(variant+'-metadata.json')).open('w') as stdout, (out/(variant+'-resolve.log')).open('w') as stderr:
                  subprocess.run(['cargo','metadata','--format-version','1','--features','jemalloc,gpu,aot,parallel']+patches,cwd=work,env=env,stdout=stdout,stderr=stderr,check=True)
              metadata=json.loads((out/(variant+'-metadata.json')).read_text())
              resolved={p['name']:p['manifest_path'] for p in metadata['packages'] if p['name'] in ['ceno_emul','ceno_zkvm','cuda_hal']}
              assert resolved['ceno_emul']==str(ceno/'ceno_emul/Cargo.toml')
              assert resolved['ceno_zkvm']==str(ceno/'ceno_zkvm/Cargo.toml')
              assert resolved['cuda_hal']==str(gpu/'cuda_hal/Cargo.toml')
              assert len({p['version'] for p in metadata['packages'] if p['name']=='metrics'})==1
              run(['cargo','build','--locked','--release','--features','jemalloc,gpu,aot,parallel','--bin','ceno-reth-benchmark-bin','--config','net.git-fetch-with-cli=true']+patches,cwd=work,log=out/(variant+'-build.log'))
              binary=root/('opcode-prover-'+variant)
              shutil.copy2(pathlib.Path(env['CARGO_TARGET_DIR'])/'release/ceno-reth-benchmark-bin',binary)
              binaries[variant]=(binary,work)
              shutil.copy2(work/'Cargo.lock',out/(variant+'-Cargo.lock'))
              identities['variants'][variant]={'benchmark':benchrev,'ceno':os.environ[variant+'_CENO'],'gpu':os.environ[variant+'_GPU'],'binary_sha256':digest(binary),'lock_sha256':digest(work/'Cargo.lock')}
              (out/'identities.json').write_text(json.dumps(identities,indent=2))

          for label,variant in [('warmup-A','A'),('warmup-B','B'),('pair1-A','A'),('pair1-B','B'),('pair2-B','B'),('pair2-A','A'),('pair3-A','A'),('pair3-B','B'),('trace-A','A'),('trace-B','B')]:
              print('Starting '+label,flush=True)
              active = subprocess.check_output(['nvidia-smi','--query-compute-apps=pid','--format=csv,noheader'],text=True).strip()
              assert not active, 'GPU has another compute workload before '+label
              run(['nvidia-smi','--query-gpu=name,uuid,memory.free,memory.total,temperature.gpu,clocks.sm,clocks.mem','--format=csv'],log=out/(label+'-hardware.txt'))
              binary,work=binaries[variant]
              runenv=env.copy();runenv['WORKSPACE_ROOT']=str(work);runenv['OUTPUT_PATH']=str(out/(label+'-metrics.json'))
              args=[str(binary),'--mode','prove-stark','--block-number','23817600','--output-dir',str(out/(label+'-proofs')),'--cache-dir',str(root/'rpc-cache'),'--gpu-devices','0','--chain-id','1']
              if label.startswith('trace-'):
                  runenv['CENO_GPU_ASSIGN_PROFILE']='1'
                  args=profile+['--output='+str(out/label)]+args
              started=time.time()
              run(args,cwd=work,log=out/(label+'.log'),runenv=runenv)
              log=(out/(label+'.log')).read_text()
              assert 'CUDA Backend Enabled' in log
              assert 'canonical base verification succeeded' in log
              assert (out/(label+'-proofs/23817600_root_proof.bin')).stat().st_size>0
              if label.startswith('trace-'):
                  run(['nsys','export','--type=sqlite','--force-overwrite=true','--output='+str(out/(label+'.sqlite')),str(out/(label+'.nsys-rep'))],log=out/(label+'-export.log'))
                  with sqlite3.connect(out/(label+'.sqlite')) as db:
                      assert db.execute('select count(*) from CUPTI_ACTIVITY_KIND_KERNEL').fetchone()[0]>0
                      assert db.execute("select count(*) from NVTX_EVENTS where text like 'ceno.witness.submit%'").fetchone()[0]>0
              (out/(label+'.done')).write_text(json.dumps({'label':label,'wall_s':time.time()-started,'verified':True}))
              print('Completed '+label,flush=True)

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcode-assignment-${{ github.run_id }}-${{ github.run_attempt }}
          path: opcode-results/
          if-no-files-found: error
          retention-days: 14
