[workspace]
[package]
name = "ceno-client-eth"
description = "Ceno Reth Guest Program"
version = "0.3.0"
edition = "2021"

[dependencies]
# workspace
openvm-client-executor = { path = "../../crates/executor/client" }
ceno_syscall = { git = "https://github.com/scroll-tech/ceno-patch", branch = "main", default-features = false }
ceno_rt = { git = "https://github.com/scroll-tech/ceno", rev = "f94735823ccdd5dae58fc147861aaabdf3e403a5", default-features = false, optional = true }
ceno_crypto = { git = "https://github.com/scroll-tech/ceno", rev = "f94735823ccdd5dae58fc147861aaabdf3e403a5", default-features = false, optional = true }
bincode = { version = "2.0.1", default-features = false, features = [
    "derive",
    "alloc",
    "serde",
] }
# ceno_sha2 = { git = "https://github.com/scroll-tech/ceno", branch = "master", default-features = false}
revm-precompile = { version = "27.0.0", default-features = false }
alloy-primitives = { version = "1.3.1", default-features = false }
alloy-consensus = { version = "1.0.37", default-features = false, features = [
    "crypto-backend",
] }
rkyv = "0.8"
# Statically turns off logging
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = [
    "max_level_off",
    "release_max_level_off",
] }

[target.'cfg(target_os = "zkvm")'.dependencies]
revm-primitives = { version = "21.0.2", features = ["hashbrown"] }
alloy-primitives = { version = "1.0.37", features = ["native-keccak"] }

[features]
default = ["ceno"]
ceno = ["dep:ceno_rt", "dep:ceno_crypto"]
profiling = ["ceno_crypto/profiling"]

[profile.release]
panic = "abort"
lto = "thin"
strip = false

[profile.profiling]
inherits = "release"
debug = 2
strip = false
