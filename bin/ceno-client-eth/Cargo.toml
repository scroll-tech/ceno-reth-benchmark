[workspace]
[package]
name = "ceno-client-eth"
description = "Ceno Reth Guest Program"
version = "0.3.0"
edition = "2021"

[dependencies]
# workspace
openvm-client-executor = { path = "../../crates/executor/client" }
ceno_syscall = { git = "https://github.com/scroll-tech/ceno-patch", branch = "main", default-features = false }
ceno_rt = { git = "https://github.com/scroll-tech/ceno", branch = "feat/opt_cycle", default-features = false }
ceno_crypto = { git = "https://github.com/scroll-tech/ceno", branch = "feat/opt_cycle", default-features = false }
bincode = { version = "2.0.1", default-features = false, features = [
    "derive",
    "alloc",
    "serde",
] }
revm-precompile = { version = "29.0.1", default-features = false }
alloy-primitives = { version = "1.4.1", default-features = false }
alloy-consensus = { version = "1.1.3", default-features = false, features = [
    "crypto-backend",
] }
# Statically turns off logging
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = [
    "max_level_off",
    "release_max_level_off",
] }

[target.'cfg(target_os = "zkvm")'.dependencies]
revm-primitives = { version = "21.0.2", features = ["hashbrown"] }
alloy-primitives = { version = "1.4.1", features = ["native-keccak"] }

[patch.crates-io]
k256 = { git = "https://github.com/scroll-tech/elliptic-curves", branch = "ceno/k256-13.4" }
p256 = { git = "https://github.com/scroll-tech/elliptic-curves", branch = "ceno/k256-13.4" }

[features]
profiling = ["ceno_crypto/profiling"]

[profile.release]
panic = "abort"
lto = "fat"
strip = false # FIXME strip = true make `_sheap` symbol lost when compile via cargo-ceno

[profile.profiling]
inherits = "release"
debug = 2
strip = false # FIXME strip = true make `_sheap` symbol lost when compile via cargo-ceno
