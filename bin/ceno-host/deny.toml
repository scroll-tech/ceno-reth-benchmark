[bans]
multiple-versions = "deny"
deny = [
    { name = "metrics", deny-multiple-versions = true, reason = "Separate metrics versions have separate global recorders, losing Ceno's cycle counts" },
]

skip = [
    # Upstream CUDA/AOT and platform dependencies still require these older APIs.
    { name = "libloading", version = "=0.7.4" },
    { name = "linux-raw-sys", version = "=0.4.15" },
    { name = "r-efi", version = "=5.3.0" },
