[package]
version = "0.1.0"
name = "openvm-reth-benchmark"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
eyre.workspace = true
url.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-forest = "0.1.6"
tracing.workspace = true
dotenv = "0.15.0"
clap = { version = "4.5.7", features = ["derive", "env"] }
serde.workspace = true
bincode = { workspace = true, features = ["std"] }
bitcode.workspace = true
metrics = "0.23.0"
metrics-util = "0.17.0"
hex = "0.4.3"
serde_json.workspace = true

# workspace
openvm-host-executor.workspace = true
openvm-client-executor.workspace = true

# ceno workspace
ceno_zkvm.workspace = true
cargo_metadata.workspace = true
ceno_emul.workspace = true
ceno_host.workspace = true
gkr_iop.workspace = true
mpcs.workspace = true
ff_ext.workspace = true
ceno_cli.workspace = true

# alloy
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rpc-client.workspace = true
alloy-transport.workspace = true

# reth
reth-primitives.workspace = true
reth-trie.workspace = true

derive_more.workspace = true
toml.workspace = true

# halo2
halo2-axiom = { version = "0.5.0", default-features = false, optional = true }

[features]
default = ["jemalloc"]
openvm-backend = []
gpu = ["ceno_cli/gpu"]
metrics = []
tco = []
aot = ["ceno_zkvm/aot-x86_64"]
evm-prove = ["halo2-axiom"]
evm-verify = ["evm-prove", "halo2-axiom"]
perf-metrics = []
mimalloc = []
jemalloc = ["ceno_zkvm/jemalloc"]
nightly-features = []
# x86 only:
halo2-asm = ["halo2-axiom?/asm"]
cuda = []
unprotected = []
